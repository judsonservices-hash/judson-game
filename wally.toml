# Deep Tide — external dependency manifest (Wally).
#
# The repo ALSO ships the bundled Knit model at vendor/Knit-1.7.0.rbxm and maps it
# into ReplicatedStorage.Packages from default.project.json, so nothing here is
# required to open or build the project. Run `wally install` only if you want to
# manage dependencies this way; it writes Packages/, which .gitignore ignores.
# Build with it via:  rojo build wally.project.json -o build/deep-tide.rbxlx

[package]
name = "deeptidestudios/deep-tide"
version = "0.1.0"
registry = "https://github.com/UpliftGames/wally-index"
realm = "shared"
license = "UNLICENSED"

[dependencies]
Knit = "sleitnick/knit@1.7.0"
